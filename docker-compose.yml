# Full stack: PostgreSQL + API + web UI.   docker compose up --build   → http://localhost:8081
# Semantic search: run scripts/fetch-model.sh first; the model directory is mounted read-only.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-searchengine}
      POSTGRES_USER: ${POSTGRES_USER:-searchengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-searchengine} -d ${POSTGRES_DB:-searchengine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-searchengine}
      DB_USERNAME: ${POSTGRES_USER:-searchengine}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "8080:8080"
    volumes:
      - index_data:/app/data/index
      - ./data/models:/app/data/models:ro

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  postgres_data:
  index_data:
