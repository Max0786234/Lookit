# PostgreSQL profile for the broader search base
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/searchengine}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:searchengine}
spring.datasource.password=${DB_PASSWORD:change_me_local_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.cache.type=${CACHE_TYPE:simple}
