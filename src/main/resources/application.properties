spring.datasource.url=${DB_URL:jdbc:h2:mem:searchengine;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false


# Engine index: a directory for the persistent segmented index, or blank for in-memory only
lookit.index.dir=${LOOKIT_INDEX_DIR:data/index}
lookit.index.commit-interval-ms=10000

# Crawler politeness floor and PageRank prior weight (ln-scale, see ADR-012)
lookit.crawler.min-delay-ms=1000
lookit.ranking.pagerank-weight=0.3

# Sentence-embedding model for semantic/hybrid search (blank disables; scripts/fetch-model.sh)
lookit.vector.model-dir=${LOOKIT_MODEL_DIR:data/models/all-MiniLM-L6-v2}

# Observability: /actuator/health, /actuator/metrics, /actuator/prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
